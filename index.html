<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Final Approach</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #ver { position: fixed; top: 8px; left: 8px; color: #fff; font: 12px monospace; opacity: .7; }
  #hud { position: fixed; bottom: 12px; left: 12px; color: #7CFF7C; font: 14px monospace; white-space: pre; background: rgba(0,0,0,.45); padding: 8px 10px; border-radius: 6px; }
</style>
</head>
<!-- index.html v0.5.2 -->
<body>
<div id="ver"></div>
<div id="hud"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // Cache-bust our own scripts on every load (GitHub Pages caches files for ~10 min)
  const v = Date.now();
  ["js/flight.js", "js/cockpit.js", "js/gear.js", "js/main.js"].forEach(src => {
    const s = document.createElement("script");
    s.src = src + "?v=" + v;
    s.async = false; // keep execution in this order
    document.body.appendChild(s);
  });
</script>
</body>
</html>
